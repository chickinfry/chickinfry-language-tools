name: Public boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary:
    name: Public boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The tree is scanned, not the history. Four early commits carry a probe
      # string that the rules now forbid; rewriting them is not worth it, and
      # this check exists to stop new ones. Run the script with --history
      # locally when auditing the past.
      - name: Scan the tree
        run: node scripts/check-public-boundary.mjs
      - name: Test the boundary check
        run: node --test scripts/check-public-boundary.test.mjs
