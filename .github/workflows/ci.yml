name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  corpus:
    name: Corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check the corpus is well formed
        run: node scripts/check-corpus.mjs
      - name: Check the agent gate is self-consistent
        run: node scripts/check-agent-gate.mjs
      - name: Test the corpus checker
        run: node --test scripts/*.test.mjs

  go:
    name: Go conformance
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Test the Go implementation against the corpus
        env:
          GOWORK: 'off'
        run: go test -mod=readonly -count=1 -v ./...

  grammar:
    name: Grammar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the tree-sitter CLI
        working-directory: tree-sitter-chik
        run: npm ci
      - name: Regenerate the parser and fail on drift
        working-directory: tree-sitter-chik
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src/
      - name: Test the grammar
        working-directory: tree-sitter-chik
        run: npx tree-sitter test
      - name: Parse the conformance corpus
        run: node scripts/check-grammar.mjs
      - name: Check the highlight queries
        run: node scripts/check-highlights.mjs
      - name: Parse the examples in spec/
        run: node scripts/check-spec-examples.mjs
      - name: Check the block keywords agree
        run: node scripts/check-keywords.mjs

  editors:
    name: Editors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fail when an editor copy of the grammar is stale
        run: node scripts/check-editors.mjs
      - name: Install the extension dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Compile the extension
        working-directory: editors/vscode
        run: npm run compile
      - name: Test the server lookup
        working-directory: editors/vscode
        run: node --test out/test/*.test.js
      - name: Test the TextMate grammar
        working-directory: editors/vscode
        run: node --test test/grammar.test.mjs
      - name: Package the extension
        working-directory: editors/vscode
        run: npx vsce package --out chik.vsix

  jetbrains:
    name: JetBrains
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the plugin
        working-directory: editors/jetbrains
        run: ./gradlew compileKotlin --no-daemon
      - name: Test the plugin
        working-directory: editors/jetbrains
        run: ./gradlew test --no-daemon
      - name: Verify the plugin structure
        working-directory: editors/jetbrains
        run: ./gradlew verifyPluginConfiguration --no-daemon

